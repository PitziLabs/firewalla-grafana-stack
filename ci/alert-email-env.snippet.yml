# MANUAL STEP — apply by hand to .github/workflows/terraform.yml
#
# The fleet runner that opened the PR for issue #156 lacks the GitHub `workflows`
# permission, so it cannot push a change to .github/workflows/terraform.yml. This
# snippet records the exact edit a human must apply so the terraform `plan` and
# `apply` jobs can see the alert-email variable.
#
# What: terraform/alerts.tf declares `variable "alert_email"` (no default). CI must
# pass it as the TF_VAR_alert_email env var, sourced from a repo secret. Add the
# secret first (Settings → Secrets and variables → Actions):
#
#     TF_VAR_ALERT_EMAIL = <the recipient address>
#
# Then add ONE line to EACH of the two `env:` blocks in terraform.yml — the `plan`
# job (~line 90) and the `apply` job (~line 172). Both blocks currently read:
#
#     env:
#       GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
#       GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
#
# Change each to:
#
#     env:
#       GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
#       GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
#       TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
#
# The `validate` job does NOT need it (terraform validate does not evaluate variable
# values). Only `plan` and `apply` do.
#
# Until both the secret and these two env lines exist, the apply-on-merge will fail
# at plan time with: "No value for required variable" (var.alert_email).
